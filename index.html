<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="OnEdge Lab · 端侧大模型学习实验室。从概念到真跑：37 节精品课程 · 90 题刷题 · 模型量化与能力体检实操沙盒，全部内容离线内置。">

  <!-- iOS PWA：添加到主屏幕后独立全屏窗口 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OnEdge Lab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OnEdge Lab · 端侧大模型学习实验室</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; background: #07100F; height: 100%; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #07100F;
      z-index: 9999;
      transition: opacity .4s;
    }
    #splash .brand {
      font-family: -apple-system, "PingFang SC", sans-serif;
      letter-spacing: 2px; font-size: 12px;
      color: #2FD6C0; opacity: .85;
    }
    #splash .name {
      font-family: Georgia, "PingFang SC", serif;
      font-size: 24px; color: #F4EFE4; margin: 10px 0 18px;
    }
    #splash .bar {
      width: 96px; height: 3px; border-radius: 99px;
      background: rgba(47, 214, 192, .15); overflow: hidden;
    }
    #splash .bar i {
      display: block; height: 100%; width: 40%;
      border-radius: 99px; background: #2FD6C0;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(340%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="brand">ONEDGE LAB</div>
    <div class="name">端侧大模型学习实验室</div>
    <div class="bar"><i></i></div>
  </div>

  <!--
    This is a placeholder for the root of your Flutter application.
  -->
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
